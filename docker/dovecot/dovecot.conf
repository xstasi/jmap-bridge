# Minimal Dovecot config for local integration testing of the JMAP bridge.
# NOT for production use: plaintext auth over an unencrypted listener,
# hardcoded test credentials. CONDSTORE/QRESYNC are enabled by default in
# modern Dovecot (no explicit directive needed) - this is what
# backends/imap/client.py's CONDSTORE support (and the currently-honest
# cannotCalculateChanges fallback for QRESYNC/VANISHED) gets tested against.

protocols = imap

# Default log_path is empty (syslog), which this minimal container image
# doesn't run - `docker logs` sees nothing. Send logs to stderr instead.
log_path = /dev/stderr
info_log_path = /dev/stderr
mail_debug = yes

mail_location = maildir:/srv/mail/%u/Maildir

passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  # Numeric uid/gid, not a name: a "vmail" system user isn't guaranteed to
  # exist in the image, and getpwnam-style lookup failures here surface to
  # the client as the same generic "[UNAVAILABLE] Internal error occurred"
  # as a home-directory permission failure - numeric ids sidestep that
  # class of failure entirely. Must match first_valid_uid/gid below, and
  # the chown in docker-compose.test.yml's dovecot entrypoint override.
  default_fields = uid=1000 gid=1000 home=/srv/mail/%u
}

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0  # disabled - the test fixture talks plaintext IMAP on 143
  }
}

first_valid_uid = 1000
first_valid_gid = 1000
