# Minimal Radicale config for local integration testing of the JMAP
# bridge's CalDAV backend. NOT for production use: plaintext htpasswd
# auth, no TLS (the test fixture talks plain HTTP, matching the plain
# HTTP Dovecot fixture already used for Mail).

[server]
hosts = 0.0.0.0:5232

[auth]
type = htpasswd
htpasswd_filename = /etc/radicale/users
htpasswd_encryption = plain

[storage]
filesystem_folder = /data/collections
